<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>円・ウォン換算 | Korea Pick</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f9f7;color:#26352f;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:white;padding:18px 7%;border-bottom:1px solid #e8eee9}
.logo{font-size:24px;font-weight:bold;color:#174d3b;text-decoration:none}
main{max-width:650px;margin:35px auto;padding:0 18px}
.back{display:inline-block;color:#26704f;text-decoration:none;margin-bottom:22px;font-size:14px}
h1{font-size:27px;color:#174d3b}
.description{color:#75837b;font-size:14px;line-height:1.7}
.card{background:white;border:1px solid #e3ebe5;border-radius:16px;padding:24px;margin-top:25px}
.label{font-size:14px;font-weight:bold;margin-bottom:10px;color:#64736a}
.currency{border:1px solid #dce5de;border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px}
input{width:100%;min-width:0;border:0;outline:none;font-size:27px;font-weight:bold;color:#26352f}
.currency span{font-size:14px;color:#64736a}
.swap{display:flex;justify-content:center;margin:16px}
.swap button{width:48px;height:48px;border:0;border-radius:50%;background:#e5f1e9;color:#174d3b;font-size:25px;cursor:pointer}
.result{margin-top:18px;background:#edf5ef;border-radius:12px;padding:18px}
.result small{color:#64736a}
.result strong{display:block;font-size:29px;color:#174d3b;margin-top:8px;overflow-wrap:anywhere}
.info{font-size:12px;color:#78867d;line-height:1.8;margin-top:18px}
button.refresh{padding:10px 15px;background:white;border:1px solid #dce5de;border-radius:8px;color:#174d3b;cursor:pointer;margin-top:12px}
button:disabled{opacity:.5}
footer{text-align:center;padding:30px;color:#89958e;font-size:12px}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Korea Pick</a></header>

<main>
<a class="back" href="index.html">← ホームに戻る</a>
<h1>💱 円・ウォン通貨換算</h1>
<p class="description">日本円と韓国ウォンを最新の参考為替レートで換算できます。</p>

<div class="card">
<div class="label" id="fromLabel">日本円（JPY）</div>
<div class="currency">
<input id="amount" type="number" min="0" step="any" value="10000">
<span id="fromCode">JPY</span>
</div>

<div class="swap">
<button id="swap" type="button" aria-label="通貨を反転">⇅</button>
</div>

<div class="label" id="toLabel">韓国ウォン（KRW）</div>
<div class="currency">
<input id="result" readonly value="取得中...">
<span id="toCode">KRW</span>
</div>

<div class="result">
<small>換算結果</small>
<strong id="resultText">レート取得中...</strong>
</div>

<div class="info">
<div id="rateText">為替レートを取得しています。</div>
<div id="dateText"></div>
<div>※金融機関の参考レートです。実際の両替所・カード決済レートとは異なります。</div>
</div>

<button class="refresh" id="refresh">↻ レートを更新</button>
</div>
</main>

<footer>© 2026 Korea Pick</footer>

<script>
const amount=document.getElementById("amount");
const result=document.getElementById("result");
const resultText=document.getElementById("resultText");
const rateText=document.getElementById("rateText");
const dateText=document.getElementById("dateText");
const refresh=document.getElementById("refresh");

let rate=null;
let rateDate=null;
let reverse=false;

function fmt(n){
return new Intl.NumberFormat("ja-JP",{maximumFractionDigits:0}).format(n);
}

function calculate(){
if(rate===null)return;
const value=Number(amount.value);

if(amount.value===""||!Number.isFinite(value)||value<0){
result.value="";
resultText.textContent="金額を入力してください";
return;
}

const converted=reverse?value/rate:value*rate;
const rounded=Math.round(converted);

result.value=fmt(rounded);
resultText.textContent=fmt(rounded)+(reverse?" 円":" ウォン");

const currentRate=reverse?1/rate:rate;
rateText.textContent="1 "+(reverse?"KRW":"JPY")+" = "+
new Intl.NumberFormat("ja-JP",{maximumFractionDigits:4}).format(currentRate)+
(reverse?" JPY":" KRW");
dateText.textContent="レート基準日："+rateDate;
}

function direction(){
reverse=!reverse;
document.getElementById("fromLabel").textContent=reverse?"韓国ウォン（KRW）":"日本円（JPY）";
document.getElementById("toLabel").textContent=reverse?"日本円（JPY）":"韓国ウォン（KRW）";
document.getElementById("fromCode").textContent=reverse?"KRW":"JPY";
document.getElementById("toCode").textContent=reverse?"JPY":"KRW";
calculate();
}

async function getRate(){
refresh.disabled=true;
refresh.textContent="取得中...";
rateText.textContent="最新レートを取得しています...";

try{
const response=await fetch("https://api.frankfurter.dev/v2/rate/JPY/KRW");
if(!response.ok)throw new Error("API error");
const data=await response.json();
if(!data.rate||!data.date)throw new Error("Invalid data");
rate=Number(data.rate);
rateDate=data.date;
calculate();
}catch(error){
rateText.textContent="レート取得に失敗しました。時間をおいて再試行してください。";
resultText.textContent="取得エラー";
console.error(error);
}finally{
refresh.disabled=false;
refresh.textContent="↻ レートを更新";
}
}

amount.addEventListener("input",calculate);
document.getElementById("swap").addEventListener("click",direction);
refresh.addEventListener("click",getRate);
getRate();
</script>
</body>
</html>
